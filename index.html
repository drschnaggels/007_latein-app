<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Via Tim ad Romam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lessons.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="max-w-xl mx-auto px-4 py-8 space-y-6">
    <header class="text-center space-y-1">
      <h1 class="text-3xl font-bold">🏛️ Via Tim ad Romam</h1>
      <p class="text-slate-500">Latein üben – Schritt für Schritt nach Rom</p>
    </header>

    <!-- Fehler / Hinweis -->
    <div id="error" class="hidden rounded-xl bg-red-50 border border-red-200 text-red-700 p-4 text-sm"></div>

    <!-- Lektionsauswahl -->
    <section id="lessonBox" class="hidden space-y-2">
      <h2 class="text-sm font-semibold text-slate-500 text-center">Welche Lektion?</h2>
      <nav id="lessons" class="flex flex-wrap justify-center gap-2"></nav>
    </section>

    <!-- Module -->
    <section id="modules" class="hidden grid gap-4 sm:grid-cols-2">
      <a id="tileVocab" href="vokabeln.html" class="block bg-white rounded-2xl shadow p-6 space-y-2 border-2 border-transparent hover:border-indigo-400 transition">
        <p class="text-4xl">📖</p>
        <p class="text-lg font-bold">Vokabeltrainer</p>
        <p id="infoVocab" class="text-sm text-slate-500"></p>
      </a>
      <a id="tileDativ" href="dativ.html" class="block bg-white rounded-2xl shadow p-6 space-y-2 border-2 border-transparent hover:border-emerald-400 transition">
        <p class="text-4xl">🎯</p>
        <p class="text-lg font-bold">Grammatik-Check: Dativ-Basics</p>
        <p id="infoDativ" class="text-sm text-slate-500"></p>
      </a>
    </section>
  </main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let lessons = [];
  let sel = ViaTim.getSelection();

  function render() {
    const nav = $('lessons');
    nav.innerHTML = '';
    const options = lessons.map(l => ({ value: l.nr, label: l.titel }));
    if (lessons.length > 1) {
      options.push({ value: ViaTim.ALL, label: lessons.length === 2 ? 'Beide zusammen' : 'Alle' });
    }
    // Ungültige Auswahl (z. B. alte Lektion) → alle
    if (!options.some(o => o.value === sel)) sel = options[options.length - 1].value;

    options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.label;
      b.className = 'px-4 py-2 rounded-xl font-semibold shadow-sm transition ' +
        (o.value === sel ? 'bg-indigo-600 text-white' : 'bg-white hover:bg-indigo-50');
      b.onclick = () => { sel = o.value; ViaTim.setSelection(sel); render(); };
      nav.appendChild(b);
    });

    const chosen = ViaTim.selected(lessons, sel);
    const count = key => chosen.reduce((n, l) => n + l[key].length, 0);
    $('infoVocab').textContent = `${count('vokabeln')} Vokabeln – Bedeutungen lernen in zwei Runden`;
    $('infoDativ').textContent = [
      `${count('dativ_substantive')} Substantive`,
      count('dativ_pronomen') && `${count('dativ_pronomen')} Pronomen`,
      count('dativ_verben') && `${count('dativ_verben')} Verben mit Dativ`,
    ].filter(Boolean).join(' · ');

    const q = '?l=' + encodeURIComponent(sel);
    $('tileVocab').href = 'vokabeln.html' + q;
    $('tileDativ').href = 'dativ.html' + q;
    history.replaceState(null, '', q);
  }

  ViaTim.loadLessons()
    .then(res => {
      lessons = res.lessons;
      ViaTim.showPartialError($('error'), res.failed);
      $('lessonBox').classList.remove('hidden');
      $('modules').classList.remove('hidden');
      render();
    })
    .catch(err => ViaTim.showLoadError($('error'), err));
})();
</script>
</body>
</html>
