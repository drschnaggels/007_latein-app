<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabeltrainer – Via Tim ad Romam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="lessons.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <main class="max-w-xl mx-auto px-4 py-6 space-y-4">
    <header class="flex items-center gap-3">
      <a id="backLink" href="index.html" class="shrink-0 px-3 py-2 rounded-xl bg-white shadow-sm text-sm font-semibold hover:bg-indigo-50">← Startseite</a>
      <div class="min-w-0">
        <h1 class="text-xl font-bold truncate">📖 Vokabeltrainer</h1>
        <p id="lessonLabel" class="text-sm text-slate-500 truncate"></p>
      </div>
    </header>

    <!-- Fehler / Hinweis -->
    <div id="error" class="hidden rounded-xl bg-red-50 border border-red-200 text-red-700 p-4 text-sm"></div>

    <!-- Übersicht: Teil 1 / Teil 2 -->
    <section id="overview" class="hidden space-y-3">
      <p class="text-sm text-slate-500 text-center">🥉 ab 60 % · 🥈 ab 80 % · 🥇 ab 95 % richtig im ersten Versuch</p>
      <div id="partList" class="grid gap-3"></div>
    </section>

    <!-- Status -->
    <section id="status" class="hidden bg-white rounded-2xl shadow p-4 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <button id="btnOverview" class="text-sm font-semibold text-slate-500 hover:text-slate-800">← Teile</button>
        <span id="partLabel" class="text-sm font-semibold px-3 py-1 rounded-full bg-indigo-100 text-indigo-700"></span>
        <span class="text-sm font-semibold">🔥 <span id="streak">0</span> <span class="text-slate-400 font-normal">(Best: <span id="bestStreak">0</span>)</span></span>
      </div>
      <div>
        <div class="flex justify-between text-xs text-slate-500 mb-1">
          <span><span id="doneCount">0</span> von <span id="totalCount">0</span> erledigt</span><span id="retryInfo"></span>
        </div>
        <div class="h-3 bg-slate-200 rounded-full overflow-hidden">
          <div id="pctBar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </section>

    <!-- Quiz-Karte -->
    <section id="quiz" class="hidden bg-white rounded-2xl shadow p-6 space-y-5">
      <div class="text-center">
        <p id="question" class="text-3xl font-bold break-words"></p>
        <p id="wordStats" class="text-xs text-slate-400 mt-2"></p>
      </div>
      <div id="answers" class="grid gap-3"></div>
    </section>

    <!-- Auswertung -->
    <section id="summary" class="hidden bg-white rounded-2xl shadow p-6 space-y-4">
      <div class="text-center space-y-1">
        <p id="sumPart" class="text-sm font-semibold text-slate-500"></p>
        <p id="sumStars" class="text-4xl text-amber-500"></p>
        <p id="sumTitle" class="text-2xl font-bold"></p>
        <p id="sumText" class="text-slate-600"></p>
        <p id="sumPct" class="text-5xl font-bold text-indigo-600"></p>
      </div>
      <div id="mistakes" class="hidden space-y-2">
        <p class="text-sm font-semibold text-slate-500">Im ersten Versuch falsch:</p>
        <ul id="mistakeList" class="text-sm divide-y divide-slate-100 border border-slate-200 rounded-xl"></ul>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button id="btnNextPart" class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700"></button>
        <button id="btnAgain" class="px-5 py-3 rounded-xl bg-amber-500 text-white font-semibold hover:bg-amber-600">Nochmal</button>
        <button id="btnToOverview" class="px-5 py-3 rounded-xl bg-slate-200 font-semibold hover:bg-slate-300">Zur Übersicht</button>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 px-5 py-3 rounded-xl bg-slate-900 text-white font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

<script>
(() => {
  const { shuffle, starsFor, starText } = ViaTim;
  const STORAGE_KEY = 'latein-app-v1';      // Wortstatistik & Best-Streak
  const PART_KEY = 'vta_vokabeln_';         // + Lektion + '_teil' + Nr
  const STREAK_MILESTONES = [5, 10, 20, 30, 50];

  const $ = id => document.getElementById(id);
  let lesson = null;       // gewählte Lektion
  let words = [];          // [{key, latin, german}] der ganzen Lektion (Ablenker-Pool)
  let parts = [];          // [{nr, title, words}]
  let run = null;          // aktueller Durchlauf
  let streak = 0;
  let locked = false;

  // ---------- Speicher ----------
  const store = (() => {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && typeof s === 'object') return { stats: {}, bestStreak: 0, ...s };
    } catch (e) {}
    return { stats: {}, bestStreak: 0 };
  })();
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
  }

  const partKey = part => `${PART_KEY}${lesson.nr}_teil${part.nr}`;
  function getResult(part) {
    try { return JSON.parse(localStorage.getItem(partKey(part))) || null; } catch (e) { return null; }
  }
  function saveResult(part, pct) {
    const old = getResult(part);
    if (old && old.best >= pct) return;
    try { localStorage.setItem(partKey(part), JSON.stringify({ best: pct, stars: starsFor(pct) })); } catch (e) {}
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('opacity-0'), 2500);
  }

  // ---------- Ansichten ----------
  function show(section) {
    ['overview', 'quiz', 'summary'].forEach(s => $(s).classList.toggle('hidden', s !== section));
    $('status').classList.toggle('hidden', section !== 'quiz');
  }

  function renderOverview() {
    locked = false;   // ausstehendes automatisches „Weiter“ verwerfen
    const list = $('partList');
    list.innerHTML = '';
    parts.forEach(part => {
      const res = getResult(part);
      const first = part.words[0].latin;
      const last = part.words[part.words.length - 1].latin;
      const b = document.createElement('button');
      b.className = 'w-full text-left bg-white rounded-2xl shadow p-4 flex items-center justify-between gap-3 border-2 border-transparent hover:border-indigo-400 transition';
      b.innerHTML = '<div class="min-w-0"><p class="font-bold"></p><p class="text-xs text-slate-500"></p></div>' +
        '<span class="shrink-0 text-xl text-amber-500"></span>';
      b.querySelector('.font-bold').textContent = part.title;
      b.querySelector('.text-xs').textContent = `${part.words.length} Vokabeln (${first} … ${last})` +
        (res ? ` · Bestwert ${res.best} %` : '');
      b.querySelector('span').textContent = starText(res ? starsFor(res.best) : 0);
      b.onclick = () => startPart(part);
      list.appendChild(b);
    });
    show('overview');
  }

  function renderStatus() {
    $('partLabel').textContent = run.part.title;
    $('doneCount').textContent = run.done;
    $('totalCount').textContent = run.totalQuestions;
    $('pctBar').style.width = Math.round(run.done / run.totalQuestions * 100) + '%';
    const retries = run.queue.filter(w => run.tried.has(w.key)).length;
    $('retryInfo').textContent = retries ? `${retries} zur Wiederholung` : '';
    $('streak').textContent = streak;
    $('bestStreak').textContent = store.bestStreak;
  }

  // ---------- Durchlauf ----------
  function startPart(part) {
    run = { part, queue: shuffle(part.words), totalQuestions: part.words.length,
      firstTryCorrect: 0, wrongItemsArray: [], tried: new Set(), done: 0 };
    nextQuestion();
  }

  function nextQuestion() {
    locked = false;
    if (!run.queue.length) return showSummary();
    renderStatus();
    const question = run.queue[0];

    // Ablenker ausschließlich aus der gewählten Lektion, eindeutige Bedeutungen
    const seen = new Set([question.german.trim().toLowerCase()]);
    const distractors = [];
    for (const w of shuffle(words)) {
      const g = w.german.trim().toLowerCase();
      if (seen.has(g)) continue;
      seen.add(g);
      distractors.push(w);
      if (distractors.length === 3) break;
    }
    const options = shuffle([question, ...distractors]);

    $('question').textContent = question.latin;
    const st = store.stats[question.key] || { right: 0, wrong: 0 };
    $('wordStats').textContent = `schon ${st.right}× richtig / ${st.wrong}× falsch`;

    const box = $('answers');
    box.innerHTML = '';
    options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'answer w-full text-left px-4 py-3 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 transition font-medium';
      b.innerHTML = `<span class="text-slate-400 mr-2">${i + 1}</span>`;
      b.appendChild(document.createTextNode(opt.german));
      b.dataset.correct = opt === question ? '1' : '0';
      b.onclick = () => answer(b);
      box.appendChild(b);
    });
    show('quiz');
  }

  function answer(btn) {
    if (locked) return;
    locked = true;
    const question = run.queue.shift();
    const correct = btn.dataset.correct === '1';
    // Gewertet wird nur der erste Versuch pro Vokabel
    const firstTry = !run.tried.has(question.key);
    run.tried.add(question.key);
    const st = store.stats[question.key] || (store.stats[question.key] = { right: 0, wrong: 0 });

    document.querySelectorAll('#answers .answer').forEach(b => {
      b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
      if (b.dataset.correct === '1') b.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
    });

    if (correct) {
      st.right++;
      if (firstTry) run.firstTryCorrect++;
      run.done++;
      streak++;
      if (streak > store.bestStreak) store.bestStreak = streak;
      if (STREAK_MILESTONES.includes(streak)) toast(`🔥 ${streak} richtig in Folge!`);
    } else {
      st.wrong++;
      if (firstTry) run.wrongItemsArray.push(question);
      streak = 0;
      // Später in diesem Teil noch einmal fragen
      const at = Math.min(run.queue.length, 3 + Math.floor(Math.random() * 3));
      run.queue.splice(at, 0, question);
      btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
    }
    save();
    renderStatus();
    setTimeout(() => { if (locked) nextQuestion(); }, correct ? 700 : 1500);
  }

  // ---------- Auswertung ----------
  const LEVELS = [
    { title: 'Noch nicht bestanden', text: 'Probiere es gleich nochmal!' },
    { title: '🥉 Bronze', text: 'Guter Versuch!' },
    { title: '🥈 Silber', text: 'Klasse! Teil gemeistert!' },
    { title: '🥇 Gold', text: 'Meisterleistung!' },
  ];

  function showSummary() {
    const { part, firstTryCorrect, totalQuestions, wrongItemsArray } = run;
    const pct = Math.round(firstTryCorrect / totalQuestions * 100);
    const stars = starsFor(pct);
    saveResult(part, pct);

    $('sumPart').textContent = `${lesson.titel} · ${part.title}`;
    $('sumStars').textContent = starText(stars);
    $('sumTitle').textContent = LEVELS[stars].title;
    $('sumPct').textContent = pct + ' %';
    $('sumText').textContent = `${firstTryCorrect} von ${totalQuestions} richtig im ersten Versuch – ${LEVELS[stars].text}`;
    if (pct >= 80 && typeof confetti === 'function') confetti({ particleCount: 120, spread: 75, origin: { y: 0.6 } });

    $('mistakes').classList.toggle('hidden', !wrongItemsArray.length);
    const list = $('mistakeList');
    list.innerHTML = '';
    wrongItemsArray.forEach(w => {
      const li = document.createElement('li');
      li.className = 'px-3 py-2';
      li.textContent = `${w.latin} = ${w.german}`;
      list.appendChild(li);
    });

    const nextPart = parts[parts.indexOf(part) + 1];
    $('btnNextPart').classList.toggle('hidden', !nextPart);
    if (nextPart) {
      $('btnNextPart').textContent = `Weiter zu ${nextPart.title} →`;
      $('btnNextPart').onclick = () => startPart(nextPart);
    }
    show('summary');
  }

  $('btnAgain').onclick = () => startPart(run.part);
  $('btnToOverview').onclick = renderOverview;
  $('btnOverview').onclick = renderOverview;

  document.addEventListener('keydown', e => {
    if ($('quiz').classList.contains('hidden')) return;
    const n = parseInt(e.key, 10);
    const btns = document.querySelectorAll('#answers .answer');
    if (n >= 1 && n <= btns.length) btns[n - 1].click();
  });

  // ---------- Start ----------
  ViaTim.loadLessons()
    .then(({ lessons, failed }) => {
      ViaTim.showPartialError($('error'), failed);
      const sel = ViaTim.getSelection();
      lesson = ViaTim.selected(lessons, sel)[0];
      $('lessonLabel').textContent = lesson.titel;
      $('backLink').href = 'index.html?l=' + encodeURIComponent(lesson.nr);
      // Lektionsname (titel) bleibt Schlüssel der Wortstatistik
      words = lesson.vokabeln.map(w => ({ key: `${lesson.titel}::${w.id}`, latin: String(w.latin), german: String(w.german) }));
      // Feste Aufteilung nach Reihenfolge in der Datei: Teil 1 = erste Hälfte, Teil 2 = Rest
      const half = Math.ceil(words.length / 2);
      parts = [
        { nr: 1, title: 'Teil 1', words: words.slice(0, half) },
        { nr: 2, title: 'Teil 2', words: words.slice(half) },
      ].filter(p => p.words.length);
      renderOverview();
    })
    .catch(err => ViaTim.showLoadError($('error'), err));
})();
</script>
</body>
</html>
